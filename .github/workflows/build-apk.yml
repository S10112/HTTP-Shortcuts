name: Build Android APK

on:
  workflow_dispatch: # 支持手动点击按钮一键打包
  push:
    branches: [ master ] # 推送代码到 master 分支时自动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 JDK 11 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'yarn'

      - name: 安装前端依赖包
        run: |
          yarn install --frozen-lockfile || yarn install

      - name: 赋予 Gradle 执行权限
        run: chmod +x android/gradlew

      - name: 编译生成 Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 上传生成的 APK 文件供下载
        uses: actions/upload-artifact@v4
        with:
          name: WizNoteLite-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
